<!DOCTYPE html>
<html>
<head><title>Books</title></head>
<body>
  <h1>Book List</h1>
  <a href="{% url 'book_create' %}">Add Book</a>
  <ul>
    {% for book in books %}
      <li>
        {{ book.title }} - {{ book.author }} ({{ book.published_year }})
        <a href="{% url 'book_update' book.pk %}">Edit</a>
        <a href="{% url 'book_delete' book.pk %}">Delete</a>
      </li>
    {% empty %}
      <li>No books yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
